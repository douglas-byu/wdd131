<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação Enviada</title>
    <link rel="stylesheet" href="css/form.css">
    <script defer src="js/review.js"></script>
</head>
<body>
    <header>
        <h1>Formulário de Avaliação de Produto</h1>
    </header>
    <main>
        <div class="form-container confirmation-message">
            <h2>Obrigado!</h2>
            <div class="confirmation-content">
                <p>Sua avaliação do produto foi enviada com sucesso.</p>
                <p>Você já concluiu <strong id="review-counter">0</strong> avaliação(ões) até agora.</p>
                <a href="formulario.html" class="back-link">Voltar para o Formulário</a>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; <span id="currentYear"></span> 🌸 Seu Nome 🌸</p>
        <p id="lastModified"></p>
    </footer>
    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();
        document.getElementById('lastModified').textContent = `Última Modificação: ${document.lastModified}`;
    </script>
</body>
</html>
