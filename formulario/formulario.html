<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação do Produto</title>
    <meta name="description" content="Formulário de Avaliação de Produto">
    <meta name="author" content="Douglas">
    <link rel="stylesheet" href="css/form.css">
    <script defer src="js/form.js"></script>
</head>

<body>
    <header>
        <h1>Formulário de Avaliação de Produto</h1>
    </header>
    <main>
        <div class="form-container">
            <h2>Avaliação do Produto</h2>
            <form method="get" action="avaliacao.html">

                <div class="form-group">
                    <label for="product">Nome do Produto</label>
                    <select id="product" name="product" required>
                        <option value="" disabled selected>Escolha um Produto ...</option>
                    </select>
                </div>

                <fieldset class="form-group rating-group">
                    <legend>Classificação Geral</legend>
                    <div class="rating-stars">
                        <label>
                            <span class="star-label">☆</span>
                            <input type="radio" id="star1" name="rating" value="1" required>
                        </label>
                        <label>
                            <span class="star-label">☆☆</span>
                            <input type="radio" id="star2" name="rating" value="2" required>
                        </label>
                        <label>
                            <span class="star-label">☆☆☆</span>
                            <input type="radio" id="star3" name="rating" value="3" required>
                        </label>
                        <label>
                            <span class="star-label">☆☆☆☆</span>
                            <input type="radio" id="star4" name="rating" value="4" required>
                        </label>
                        <label>
                            <span class="star-label">☆☆☆☆☆</span>
                            <input type="radio" id="star5" name="rating" value="5" required>
                        </label>
                    </div>
                </fieldset>

                <div class="form-group">
                    <label for="installation-date">Data de Instalação</label>
                    <input type="date" id="installation-date" name="installation-date" required>
                </div>

                <fieldset class="form-group features-group">
                    <legend>Quais recursos você achou úteis no produto? <br><span>(Marque todos que se aplicam)</span>
                    </legend>

                    <label><input type="checkbox" id="feature-durability" name="features" value="durability">
                        Durabilidade</label>
                    <label><input type="checkbox" id="feature-ease" name="features" value="ease-of-use"> Facilidade de
                        Uso</label>
                    <label><input type="checkbox" id="feature-performance" name="features" value="performance">
                        Desempenho</label>
                    <label><input type="checkbox" id="feature-design" name="features" value="design"> Design</label>
                </fieldset>

                <div class="form-group">
                    <label for="review">Avaliação Escrita <span class="optional">(Optional)</span></label>
                    <textarea id="review" name="review" rows="4"></textarea>
                </div>

                <div class="form-group">
                    <label for="username">Seu Nome <span class="optional">(Optional)</span></label>
                    <input type="text" id="username" name="username">
                </div>

                <div class="form-actions">
                    <input type="submit" value="Publicar Avaliação">
                </div>
            </form>
        </div>
    </main>
    <footer>
        <p>&copy; <span id="currentYear"></span> 🌸 Douglas Silva 🌸</p>
        <p id="lastModified"></p>
    </footer>

</body>

</html>
